[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-twinx"
version = "0.6.1"
description = "A terminal music player with online and offline modes sourced from youtube."
readme = "README.md"
requires-python = ">=3.14"
dynamic = []
dependencies = [
    "flask",
    "numpy",
    "pillow",
    "psutil>=7.2.2",
    "python-vlc",
    "questionary",
    "sounddevice",
    "yt_dlp",
    "ytmusicapi",
]

[project.scripts]
flow = "flow_twinx.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flow_twinx*"]

[tool.setuptools.package-data]
flow_twinx = ["web/templates/*", "Hyprland/*.qml"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
