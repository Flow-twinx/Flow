[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-twinx"
version = "0.7.0"
description = "A terminal music player with online and offline modes sourced from youtube."
readme = "README.md"
requires-python = ">=3.14"
dynamic = []
dependencies = [
    "flask",
    "numpy",
    "pillow",
    "psutil>=7.2.2",
    "python-vlc",
    "questionary",
    "sounddevice",
    "textual>=8.2.8",
    "yt_dlp",
    "ytmusicapi",
]

[project.scripts]
flow = "cli.main:main"
flowt = "tui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "backend*"]

[tool.setuptools.package-data]
flow_twinx = ["Hyprland/*.qml"]
backend = ["web/templates/*"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "textual-dev>=1.8.0",
]
